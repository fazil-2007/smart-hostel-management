server.port=${SERVER_PORT:8080}

# Database configuration (supports MySQL with H2 fallback capability)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_hostel}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:super_secret_university_smart_hostel_jwt_key_2026_secure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging configuration
logging.level.org.springframework.web=INFO
logging.level.com.hostel=INFO
